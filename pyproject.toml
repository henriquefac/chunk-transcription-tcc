[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transcription-processing"
version = "0.1.0"
description = "Processamento de transcrições com chunking, hashing de falas e parsing de timestamps."
authors = [
    { name = "Henrique Façanha" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "spacy >= 3.7.0",
]

keywords = ["transcription", "audio", "chunking", "NLP", "text", "speech"]

classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["transcription_processing*"]
